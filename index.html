<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Биб-чат</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #0f172a; color: #fff; }

        /* Вход */
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; max-width: 400px; width: 100%; }
        h1 { color: #38bdf8; margin-bottom: 20px; }
        .btn-google { background: #fff; color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; }

        /* Главный экран */
        #main-app { display: none; flex-direction: column; height: 100vh; }

        /* Шапка */
        .top-bar { height: 45px; background: #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        .logout-link { color: #ef4444; cursor: pointer; text-decoration: underline; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Экран входа -->
    <div id="login-screen" class="login-container">
        <div class="card">
            <h1>Биб-чат</h1>
            <button class="btn-google" onclick="loginWithGoogle()">
                Войти через Google
            </button>
        </div>
    </div>

    <!-- Основное приложение -->
    <div id="main-app">
        <div class="top-bar">
            <span>Биб-чат</span>
            <span class="logout-link" onclick="logout()">Выйти</span>
        </div>
        <div style="padding: 20px; text-align: center;">
            <h2>Добро пожаловать в чат!</h2>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://bib-chat-64027-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Авторизация через Firebase Google Auth
        const provider = new firebase.auth.GoogleAuthProvider();

        let currentUser = null;
        let pendingExpandFn = null;
        const messageTextsStore = {};

        const badWords = ["сука", "блять"];
        function censor(text) {
            let result = text;
            badWords.forEach(w => {
                const reg = new RegExp(w, "gi");
                result = result.replace(reg, "***");
            });
            return result;
        }

        function loginWithGoogle() {
            firebase.auth().signInWithPopup(provider)
                .then((result) => {
                    const user = result.user;
                    currentUser = {
                        id: user.uid,
                        name: user.displayName || user.email.split("@")[0],
                        email: user.email,
                        picture: user.photoURL
                    };
                    showAppScreen();
                })
                .catch((error) => {
                    console.error("Ошибка входа:", error);
                    alert("Ошибка входа: " + error.message);
                });
        }

        function showAppScreen() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("main-app").style.display = "flex";
        }

        function logout() {
            firebase.auth().signOut().then(() => {
                currentUser = null;
                document.getElementById("login-screen").style.display = "flex";
                document.getElementById("main-app").style.display = "none";
            });
        }

        // Автоматическая проверка состояния авторизации
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                currentUser = {
                    id: user.uid,
                    name: user.displayName || user.email.split("@")[0],
                    email: user.email,
                    picture: user.photoURL
                };
                showAppScreen();
            }
        });
    </script>
</body>
</html>
