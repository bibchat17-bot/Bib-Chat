<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bib Chat</title>
    <!-- Подключаем Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; text-align: center; }
        .card { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .btn-google { background: #fff; color: #333; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; width: 100%; justify-content: center; box-sizing: border-box; }
        .btn-google:hover { background: #f1f5f9; }
        #chat-screen { display: none; width: 100%; height: 100vh; flex-direction: column; background: #0f172a; }
        .chat-header { background: #1e293b; padding: 15px; font-weight: bold; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #334155; padding: 10px 14px; border-radius: 10px; max-width: 80%; word-break: break-word; }
        .message.my { background: #0284c7; align-self: flex-end; }
        .chat-input-area { padding: 15px; background: #1e293b; display: flex; gap: 10px; border-top: 1px solid #334155; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
        .chat-input-area button { background: #0284c7; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Экран входа -->
    <div id="login-screen" class="container">
        <div class="card">
            <h1>BibChat</h1>
            <p>Войдите через аккаунт Google, чтобы начать общение</p>
            <button class="btn-google" onclick="loginWithGoogle()">
                <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Войти через Google
            </button>
        </div>
    </div>

    <!-- Экран чата -->
    <div id="chat-screen">
        <div class="chat-header">
            <span id="user-name">BibChat</span>
            <button onclick="logout()" style="background: #ef4444; color: #fff; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer;">Выйти</button>
        </div>
        <div class="chat-messages" id="messages"></div>
        <div class="chat-input-area">
            <input type="text" id="message-input" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        // Конфигурация Firebase
        const firebaseConfig = {
            databaseURL: "https://bib-chat-64027-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const CLIENT_ID = "880927818848-kb4kte7oln0i7jork2h8i95sdknrmmt2.apps.googleusercontent.com";
        const REDIRECT_URI = "https://bibchat17-bot.github.io/Bib-Chat/";

        let currentUser = null;

        // Безопасная расшифровка JWT токена
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                console.error("Ошибка расшифровки токена:", e);
                return null;
            }
        }

        // Перенаправление на страницу входа Google
        function loginWithGoogle() {
            const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=email%20profile`;
            window.location.href = authUrl;
        }

        // Проверка токена в URL при возврате с Google
        window.onload = function() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');
            const idToken = params.get('id_token'); // Иногда приходит в id_token

            // Также проверим sessionStorage на случай сохранения сессии
            const savedUser = sessionStorage.getItem('bib_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showChat();
                return;
            }

            if (accessToken) {
                // Получаем инфо о пользователе по access_token
                fetch(`https://www.googleapis.com/oauth2/v3/userinfo?access_token=${accessToken}`)
                    .then(res => res.json())
                    .then(data => {
                        currentUser = { name: data.name, email: data.email, id: data.sub };
                        sessionStorage.setItem('bib_user', JSON.stringify(currentUser));
                        window.location.hash = ''; // Очищаем URL от токена
                        showChat();
                    })
                    .catch(err => console.error("Ошибка получения профиля:", err));
            }
        };

        function showChat() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('user-name').innerText = `Чат (${currentUser.name})`;
            loadMessages();
        }

        function logout() {
            sessionStorage.removeItem('bib_user');
            window.location.href = REDIRECT_URI;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            db.ref('messages').push({
                name: currentUser.name,
                text: text,
                time: Date.now()
            });
            input.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function loadMessages() {
            const messagesContainer = document.getElementById('messages');
            db.ref('messages').on('value', (snapshot) => {
                messagesContainer.innerHTML = '';
                const data = snapshot.val();
                if (data) {
                    Object.values(data).forEach(msg => {
                        const div = document.createElement('div');
                        div.className = `message ${msg.name === currentUser.name ? 'my' : ''}`;
                        div.innerText = `${msg.name}: ${msg.text}`;
                        messagesContainer.appendChild(div);
                    });
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            });
        }
    </script>
</body>
</html>
