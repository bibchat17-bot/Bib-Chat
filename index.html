<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bib-Chat — Глобальный чат</title>
    <!-- Подключение Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Подключение Firebase для онлайн-чата -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e63946, #f77f00);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Экран входа */
        .login-card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .login-card h1 {
            color: #111;
            font-size: 1.8rem;
        }

        .login-card p {
            color: #666;
            font-size: 0.95rem;
        }

        /* Основной чат */
        .chat-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: none; /* Скрыт до входа */
            flex-direction: column;
            height: 90vh;
            overflow: hidden;
        }

        .chat-header {
            background: #111;
            color: #fff;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 1.2rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn {
            background: #d90429;
            border: none;
            color: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .tab-btn {
            background: #f77f00;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .messages-list {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f9f9f9;
        }

        .message-card {
            background: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: relative;
            word-wrap: break-word;
            border-left: 4px solid #f77f00;
        }

        .message-card.warning-card {
            border-left: 4px solid #d90429;
            background: #fff0f0;
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 4px;
        }

        .msg-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .msg-text {
            font-size: 0.95rem;
            color: #222;
        }

        .bad-word-alert {
            color: #d90429;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .show-btn {
            background: #d90429;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-top: 5px;
        }

        .action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .chat-input-area {
            padding: 10px;
            background: #fff;
            display: flex;
            gap: 8px;
            border-top: 1px solid #eee;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .chat-input-area button {
            background: #e63946;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- Экран Авторизации -->
<div class="login-card" id="login-screen">
    <h1>Глобальный чат</h1>
    <p>Добро пожаловать в общий чат! Войдите, чтобы общаться со всеми.</p>
    
    <div id="g_id_onload"
         data-client_id="880927818848-kb4kte7oln0i7jork2h8i95sdknrmmt2.apps.googleusercontent.com"
         data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard" data-size="large"></div>
</div>

<!-- Экран Чата -->
<div class="chat-container" id="chat-screen">
    <div class="chat-header">
        <h2 id="chat-title">Глобальный чат</h2>
        <div class="user-info">
            <span id="user-name" style="font-size: 0.85rem;"></span>
            <button class="tab-btn" onclick="toggleView()" id="toggle-btn">Избранное</button>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
    </div>

    <div class="messages-list" id="messages-list"></div>

    <div class="chat-input-area" id="input-area">
        <input type="text" id="msg-input" placeholder="Напишите в общий чат...">
        <button onclick="sendMessage()">Отправить</button>
    </div>
</div>

<script>
    // Подключение к публичному онлайн-серверу Firebase
    const firebaseConfig = {
        databaseURL: "https://bib-chat-global-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("global_messages");

    const BAD_WORDS = ["пизда", "блять", "хуй", "сука", "нахуй", "бля", "ебать", "пидор", "мудак", "пидец", "хер"];

    let currentUser = JSON.parse(localStorage.getItem('bib_chat_user')) || null;
    let globalMessages = [];
    let favorites = JSON.parse(localStorage.getItem('bib_chat_favs')) || [];
    let currentTab = 'chat';

    function parseJwt (token) {
        var base64Url = token.split('.')[1];
        var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
        const responsePayload = parseJwt(response.credential);
        currentUser = {
            id: responsePayload.sub,
            name: responsePayload.name
        };
        localStorage.setItem('bib_chat_user', JSON.stringify(currentUser));
        checkAuthStatus();
    }

    function logout() {
        localStorage.removeItem('bib_chat_user');
        currentUser = null;
        checkAuthStatus();
    }

    function checkAuthStatus() {
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const userName = document.getElementById('user-name');

        if (currentUser) {
            loginScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            userName.innerText = currentUser.name;
            listenGlobalMessages();
        } else {
            loginScreen.style.display = 'flex';
            chatScreen.style.display = 'none';
        }
    }

    // Получение сообщений со всеобщего сервера в реальном времени
    function listenGlobalMessages() {
        db.limitToLast(100).on('value', (snapshot) => {
            const data = snapshot.val();
            globalMessages = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    globalMessages.push({ id: key, ...data[key] });
                });
            }
            renderMessages();
        });
    }

    function checkBadWords(text) {
        const lower = text.toLowerCase();
        return BAD_WORDS.some(word => lower.includes(word));
    }

    function maskText(text) {
        let cleanText = text;
        BAD_WORDS.forEach(word => {
            const regex = new RegExp(word, 'gi');
            cleanText = cleanText.replace(regex, '***');
        });
        return cleanText;
    }

    function renderMessages() {
        const list = document.getElementById('messages-list');
        list.innerHTML = '';

        const source = currentTab === 'chat' ? globalMessages : favorites;

        if (source.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:#888; margin-top:20px;">Сообщений пока нет</div>';
            return;
        }

        source.forEach((msg) => {
            const card = document.createElement('div');
            card.className = 'message-card' + (msg.hasBadWords ? ' warning-card' : '');

            const isFav = favorites.some(f => f.id === msg.id);
            const isMyMessage = currentUser && msg.authorId === currentUser.id;

            let contentHTML = '';

            if (msg.hasBadWords) {
                contentHTML = `
                    <div class="bad-word-alert">⚠️ Внимание: Контент содержит 18+! Просматривать с осторожностью.</div>
                    <div class="msg-text" id="text-${msg.id}">${msg.maskedText}</div>
                    <button class="show-btn" onclick="revealText('${msg.id}', '${encodeURIComponent(msg.originalText)}')">Показать оригинал</button>
                `;
            } else {
                contentHTML = `<div class="msg-text">${msg.originalText}</div>`;
            }

            let deleteBtnHTML = isMyMessage ? `<button class="action-btn" onclick="deleteMessage('${msg.id}')" title="Удалить">🗑️</button>` : '';

            card.innerHTML = `
                <div class="msg-header">
                    <span><strong>${msg.author || 'Аноним'}</strong> • ${msg.time}</span>
                    <div class="msg-actions">
                        <button class="action-btn" onclick="toggleFav('${msg.id}')">${isFav ? '⭐' : '☆'}</button>
                        ${deleteBtnHTML}
                    </div>
                </div>
                ${contentHTML}
            `;

            list.appendChild(card);
        });

        list.scrollTop = list.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text || !currentUser) return;

        const hasBad = checkBadWords(text);
        const masked = maskText(text);

        const newMsg = {
            author: currentUser.name,
            authorId: currentUser.id,
            originalText: text,
            maskedText: masked,
            hasBadWords: hasBad,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            timestamp: firebase.database.ServerValue.TIMESTAMP
        };

        // Отправка в общую базу данных для всех
        db.push(newMsg);
        input.value = '';
    }

    function revealText(id, encodedOriginal) {
        const elem = document.getElementById(`text-${id}`);
        if (elem) {
            elem.innerText = decodeURIComponent(encodedOriginal);
        }
    }

    function deleteMessage(id) {
        if (currentTab === 'chat') {
            db.child(id).remove();
        }
        favorites = favorites.filter(f => f.id !== id);
        localStorage.setItem('bib_chat_favs', JSON.stringify(favorites));
        renderMessages();
    }

    function toggleFav(id) {
        const msg = globalMessages.find(m => m.id === id) || favorites.find(m => m.id === id);
        if (!msg) return;

        const favIndex = favorites.findIndex(f => f.id === id);
        if (favIndex > -1) {
            favorites.splice(favIndex, 1);
        } else {
            favorites.push(msg);
        }

        localStorage.setItem('bib_chat_favs', JSON.stringify(favorites));
        renderMessages();
    }

    function toggleView() {
        const title = document.getElementById('chat-title');
        const btn = document.getElementById('toggle-btn');
        const inputArea = document.getElementById('input-area');

        if (currentTab === 'chat') {
            currentTab = 'fav';
            title.innerText = 'Избранное';
            btn.innerText = 'В чат';
            inputArea.style.display = 'none';
        } else {
            currentTab = 'chat';
            title.innerText = 'Глобальный чат';
            btn.innerText = 'Избранное';
            inputArea.style.display = 'flex';
        }

        renderMessages();
    }

    document.getElementById('msg-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
    });

    checkAuthStatus();
</script>

</body>
</html>
