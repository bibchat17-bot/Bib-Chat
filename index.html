<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bib-Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Экраны */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
    }
    #app-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
    }
    /* Шапка */
    header {
      background: #1f1f1f;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    .header-btns {
      display: flex;
      gap: 10px;
    }
    /* Сообщения */
    #messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      word-wrap: break-word;
    }
    .message.my {
      align-self: flex-end;
      background: #3700b3;
      color: #fff;
    }
    .message.other {
      align-self: flex-start;
      background: #2c2c2c;
      color: #e0e0e0;
    }
    .message-sender {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 3px;
    }
    /* Постоянная панель ввода снизу */
    #input-container {
      background: #1f1f1f;
      padding: 10px 15px;
      display: flex;
      gap: 10px;
      align-items: center;
      border-top: 1px solid #333;
    }
    #message-input {
      flex: 1;
      background: #2c2c2c;
      border: 1px solid #444;
      padding: 12px 15px;
      border-radius: 20px;
      color: #fff;
      outline: none;
    }
    #send-btn, .btn {
      background: #bb86fc;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    #send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>

  <!-- Firebase SDK v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- Экран входа -->
  <div id="login-screen">
    <h1>Bib-Chat</h1>
    <button class="btn" id="login-btn">Войти через Google</button>
  </div>

  <!-- Главный экран чата -->
  <div id="app-screen">
    <header>
      <h2>Bib-Chat</h2>
      <div class="header-btns">
        <button class="btn" id="focus-input-btn" style="padding: 6px 14px; font-size: 13px;">✏️ Написать</button>
        <button class="btn" id="logout-btn" style="padding: 6px 12px; font-size: 12px; background: #333; color: #fff;">Выйти</button>
      </div>
    </header>

    <div id="messages-container"></div>

    <!-- Поле ввода всегда снизу -->
    <div id="input-container">
      <input type="text" id="message-input" placeholder="Введите сообщение...">
      <button id="send-btn">➤</button>
    </div>
  </div>

  <script>
    // Конфигурация Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDaz-XIubX1sj1NdF-mfyukHCAJAzTgDLI",
      authDomain: "bib-chat-64027.firebaseapp.com",
      databaseURL: "https://bib-chat-64027-default-rtdb.firebaseio.com",
      projectId: "bib-chat-64027",
      storageBucket: "bib-chat-64027.firebasestorage.app",
      messagingSenderId: "381474259253",
      appId: "1:381474259253:web:6b6ddb63fffeba31f0cc7c",
      measurementId: "G-87651911DZ"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.database();

    const loginScreen = document.getElementById('login-screen');
    const appScreen = document.getElementById('app-screen');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const focusInputBtn = document.getElementById('focus-input-btn');
    const sendBtn = document.getElementById('send-btn');
    const messageInput = document.getElementById('message-input');
    const messagesContainer = document.getElementById('messages-container');

    // Кнопка "Написать" ставит курсор в поле ввода снизу
    focusInputBtn.addEventListener('click', () => {
      messageInput.focus();
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });

    // Вход через Redirect
    loginBtn.addEventListener('click', () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithRedirect(provider);
    });

    // Выход
    logoutBtn.addEventListener('click', () => auth.signOut());

    // Переключение экранов при авторизации
    auth.onAuthStateChanged(user => {
      if (user) {
        loginScreen.style.display = 'none';
        appScreen.style.display = 'flex';
        loadMessages();
      } else {
        loginScreen.style.display = 'flex';
        appScreen.style.display = 'none';
      }
    });

    // Отслеживание ошибок авторизации
    auth.getRedirectResult().catch(error => {
      if (error && error.message) {
        alert("Ошибка входа: " + error.message);
      }
    });

    // Отправка сообщений
    function sendMessage() {
      const text = messageInput.value.trim();
      const user = auth.currentUser;
      if (text && user) {
        db.ref('messages').push({
          uid: user.uid,
          name: user.displayName || 'Аноним',
          text: text,
          timestamp: Date.now()
        });
        messageInput.value = '';
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Загрузка сообщений
    function loadMessages() {
      db.ref('messages').limitToLast(50).on('value', snapshot => {
        messagesContainer.innerHTML = '';
        const data = snapshot.val();
        if (data) {
          Object.values(data).forEach(msg => {
            const isMy = auth.currentUser && msg.uid === auth.currentUser.uid;
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isMy ? 'my' : 'other'}`;
            msgDiv.innerHTML = `
              <div class="message-sender">${msg.name}</div>
              <div class="message-text">${msg.text}</div>
            `;
            messagesContainer.appendChild(msgDiv);
          });
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
      });
    }
  </script>
</body>
</html>
