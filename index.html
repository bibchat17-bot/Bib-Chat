<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bib Chat</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 0; height: 100vh; overflow: hidden; }

        /* Экран входа */
        .login-container { display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        h1 { color: #38bdf8; margin-top: 0; }
        .btn-google { background: #fff; color: #333; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }

        /* Главное приложение */
        #main-app { display: none; width: 100%; height: 100vh; position: relative; flex-direction: column; }

        /* Шапка */
        .top-bar { height: 50px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; font-weight: bold; }
        .logout-link { color: #ef4444; font-size: 13px; text-decoration: none; cursor: pointer; }

        /* Область экранов (Чат / Профиль) */
        .content-area { position: absolute; top: 50px; bottom: 60px; left: 0; right: 0; overflow: hidden; display: flex; flex-direction: column; }
        
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
        .screen.active { display: flex; }

        /* Сообщения чата */
        .messages-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #334155; padding: 8px 12px; border-radius: 12px; max-width: 80%; word-break: break-word; align-self: flex-start; }
        .message.my { background: #0284c7; align-self: flex-end; }
        .msg-author { font-size: 11px; font-weight: bold; color: #38bdf8; margin-bottom: 2px; }
        .message.my .msg-author { color: #bae6fd; }
        .msg-text { font-size: 14px; }
        .msg-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
        .msg-time { font-size: 10px; color: #94a3b8; }
        .message.my .msg-time { color: #e0f2fe; }
        .delete-btn { background: none; border: none; color: #fca5a5; font-size: 11px; cursor: pointer; padding: 0; }

        /* Поле ввода сообщения */
        .input-bar { padding: 10px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 8px; }
        .input-bar input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
        .input-bar button { background: #0284c7; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; }

        /* Профиль */
        .profile-box { padding: 20px; text-align: center; margin: auto; background: #1e293b; border-radius: 12px; width: 85%; max-width: 320px; }
        .profile-btn-logout { background: #ef4444; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 15px; cursor: pointer; }

        /* Фиксированная нижняя панель */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: space-around; align-items: center; z-index: 999; }
        .nav-btn { background: none; border: none; color: #94a3b8; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-btn.active { color: #38bdf8; }
    </style>
</head>
<body>

    <!-- Вход -->
    <div id="login-screen" class="login-container">
        <div class="card">
            <h1>BibChat</h1>
            <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">Войдите через Google</p>
            <button class="btn-google" onclick="loginWithGoogle()">
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Войти через Google
            </button>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <div id="main-app">
        <!-- Шапка -->
        <div class="top-bar">
            <span id="header-title">BibChat</span>
            <span class="logout-link" onclick="logout()">Выйти</span>
        </div>

        <!-- Контентная область -->
        <div class="content-area">
            <!-- Вкладка Чат -->
            <div id="screen-chat" class="screen active">
                <div class="messages-container" id="messages"></div>
                <div class="input-bar">
                    <input type="text" id="message-input" placeholder="Сообщение..." onkeypress="handleKeyPress(event)">
                    <button onclick="sendMessage()">></button>
                </div>
            </div>

            <!-- Вкладка Профиль -->
            <div id="screen-profile" class="screen">
                <div class="profile-box">
                    <h3 id="profile-name" style="color: #38bdf8; margin: 0 0 8px 0;">Имя</h3>
                    <div id="profile-email" style="color: #94a3b8; font-size: 14px;">email@gmail.com</div>
                    <button class="profile-btn-logout" onclick="logout()">Выйти из аккаунта</button>
                </div>
            </div>
        </div>

        <!-- Нижнее меню -->
        <div class="bottom-nav">
            <button class="nav-btn active" id="btn-tab-chat" onclick="switchTab('chat')">
                💬 <span>Чат</span>
            </button>
            <button class="nav-btn" id="btn-tab-profile" onclick="switchTab('profile')">
                👤 <span>Профиль</span>
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://bib-chat-64027-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const CLIENT_ID = "880927818848-kb4kte7oln0i7jork2h8i95sdknrmmt2.apps.googleusercontent.com";
        const REDIRECT_URI = "https://bibchat17-bot.github.io/Bib-Chat/";

        let currentUser = null;

        // Матерные слова для замены
        const badWords = ["сука", "блять", "пидор", "хуй", "жопа", "нах", "еб", "чмо"];
        function censor(text) {
            let result = text;
            badWords.forEach(w => {
                const reg = new RegExp(w, "gi");
                result = result.replace(reg, "***");
            });
            return result;
        }

        function loginWithGoogle() {
            const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=email%20profile`;
            window.location.href = authUrl;
        }

        window.onload = function() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');

            const saved = sessionStorage.getItem('bib_user');
            if (saved) {
                currentUser = JSON.parse(saved);
                initApp();
                return;
            }

            if (accessToken) {
                fetch(`https://www.googleapis.com/oauth2/v3/userinfo?access_token=${accessToken}`)
                    .then(r => r.json())
                    .then(data => {
                        currentUser = { name: data.name, email: data.email };
                        sessionStorage.setItem('bib_user', JSON.stringify(currentUser));
                        window.location.hash = '';
                        initApp();
                    });
            }
        };

        function initApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            
            document.getElementById('profile-name').innerText = currentUser.name;
            document.getElementById('profile-email').innerText = currentUser.email;

            loadMessages();
        }

        function switchTab(tab) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            if (tab === 'chat') {
                document.getElementById('screen-chat').classList.add('active');
                document.getElementById('btn-tab-chat').classList.add('active');
                document.getElementById('header-title').innerText = "BibChat";
            } else {
                document.getElementById('screen-profile').classList.add('active');
                document.getElementById('btn-tab-profile').classList.add('active');
                document.getElementById('header-title').innerText = "Профиль";
            }
        }

        function logout() {
            sessionStorage.removeItem('bib_user');
            window.location.href = REDIRECT_URI;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            let txt = input.value.trim();
            if (!txt || !currentUser) return;

            txt = censor(txt);
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            db.ref('messages').push({
                name: currentUser.name,
                text: txt,
                time: timeStr
            });
            input.value = '';
        }

        function deleteMessage(id) {
            db.ref('messages/' + id).remove();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function loadMessages() {
            const box = document.getElementById('messages');
            db.ref('messages').on('value', snap => {
                box.innerHTML = '';
                const data = snap.val();
                if (data) {
                    Object.entries(data).forEach(([id, msg]) => {
                        const isMy = currentUser && msg.name === currentUser.name;
                        const div = document.createElement('div');
                        div.className = `message ${isMy ? 'my' : ''}`;
                        
                        let delBtn = isMy ? `<button class="delete-btn" onclick="deleteMessage('${id}')">Удалить</button>` : '';

                        div.innerHTML = `
                            <div class="msg-author">${msg.name}</div>
                            <div class="msg-text">${msg.text}</div>
                            <div class="msg-footer">
                                <span class="msg-time">${msg.time || ''}</span>
                                ${delBtn}
                            </div>
                        `;
                        box.appendChild(div);
                    });
                    box.scrollTop = box.scrollHeight;
                }
            });
        }
    </script>
</body>
</html>
