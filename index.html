<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bib Chat</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #0f172a; color: #fff; height: 100vh; display: flex; flex-direction: column; }

        /* Вход */
        .login-container { display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 320px; text-align: center; }
        h1 { color: #38bdf8; margin-bottom: 15px; }
        .btn-google { background: #fff; color: #333; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; }

        /* Главный экран */
        #main-app { display: none; flex-direction: column; height: 100vh; width: 100%; }

        /* Шапка */
        .top-bar { height: 45px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; font-weight: bold; flex-shrink: 0; }
        .logout-link { color: #ef4444; font-size: 13px; cursor: pointer; }

        /* Основные экраны */
        .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .screen.active { display: flex; }

        /* Список сообщений */
        .messages-container { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .message { background: #334155; padding: 8px 10px; border-radius: 8px; max-width: 85%; word-break: break-word; align-self: flex-start; }
        .message.my { background: #0284c7; align-self: flex-end; }
        .msg-author { font-size: 11px; font-weight: bold; color: #38bdf8; }
        .message.my .msg-author { color: #bae6fd; }
        .msg-text { font-size: 14px; margin-top: 2px; }
        .msg-footer { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 4px; font-size: 10px; color: #94a3b8; }
        .action-btn { background: none; border: none; font-size: 10px; cursor: pointer; padding: 0; }
        .fav-btn { color: #facc15; }
        .delete-btn { color: #fca5a5; }

        /* Блок ввода сообщения */
        .input-bar { background: #1e293b; border-top: 1px solid #334155; padding: 8px; display: flex; gap: 6px; flex-shrink: 0; }
        .input-bar input { flex: 1; height: 40px; padding: 0 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
        .input-bar button { height: 40px; background: #0284c7; color: #fff; border: none; padding: 0 14px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; }

        /* Профиль */
        .profile-box { padding: 20px; text-align: center; margin: auto; background: #1e293b; border-radius: 10px; width: 90%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
        .status-badge { font-size: 12px; padding: 6px; border-radius: 6px; background: #334155; color: #cbd5e1; }
        .status-badge.deletion { background: #7f1d1d; color: #fca5a5; }
        .btn-danger { background: #ef4444; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-success { background: #22c55e; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; }

        /* Нижнее меню */
        .bottom-nav { height: 50px; background: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: space-around; align-items: center; flex-shrink: 0; }
        .nav-btn { background: none; border: none; color: #94a3b8; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .nav-btn.active { color: #38bdf8; }
    </style>
</head>
<body>

    <!-- Экран входа -->
    <div id="login-screen" class="login-container">
        <div class="card">
            <h1>BibChat</h1>
            <p style="color: #94a3b8; font-size: 13px; margin-bottom: 15px;">Войдите через Google</p>
            <button class="btn-google" onclick="loginWithGoogle()">Войти через Google</button>
        </div>
    </div>

    <!-- Основное приложение -->
    <div id="main-app">
        <div class="top-bar">
            <span id="header-title">BibChat</span>
            <span class="logout-link" onclick="logout()">Выйти</span>
        </div>

        <!-- Экран Чат -->
        <div id="screen-chat" class="screen active">
            <div class="messages-container" id="messages"></div>
            <div class="input-bar">
                <input type="text" id="message-input" placeholder="Написать..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">Отправить</button>
            </div>
        </div>

        <!-- Экран Избранное -->
        <div id="screen-favorites" class="screen">
            <div class="messages-container" id="favorite-messages"></div>
        </div>

        <!-- Экран Профиль -->
        <div id="screen-profile" class="screen">
            <div class="profile-box">
                <h3 id="profile-name" style="color: #38bdf8; margin: 0;">Имя</h3>
                <div id="profile-email" style="color: #94a3b8; font-size: 13px;">email@gmail.com</div>
                <div id="account-status" class="status-badge">Аккаунт активен</div>
                <div id="action-buttons">
                    <button id="btn-delete-acc" class="btn-danger" onclick="requestDeleteAccount()">Удалить аккаунт (14 дней)</button>
                    <button id="btn-restore-acc" class="btn-success" onclick="restoreAccount()" style="display: none;">Восстановить аккаунт</button>
                </div>
                <button class="btn-danger" style="background: #475569;" onclick="logout()">Выйти из системы</button>
            </div>
        </div>

        <!-- Нижнее меню -->
        <div class="bottom-nav">
            <button class="nav-btn active" id="btn-tab-chat" onclick="switchTab('chat')">
                💬 <span>Чат</span>
            </button>
            <button class="nav-btn" id="btn-tab-favorites" onclick="switchTab('favorites')">
                ⭐ <span>Избранное</span>
            </button>
            <button class="nav-btn" id="btn-tab-profile" onclick="switchTab('profile')">
                👤 <span>Профиль</span>
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://bib-chat-64027-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const CLIENT_ID = "880927818848-kb4kte7oln0i7jork2h8i95sdknrmmt2.apps.googleusercontent.com";
        const REDIRECT_URI = "https://bibchat17-bot.github.io/Bib-Chat/";

        let currentUser = null;

        const badWords = ["сука", "блять", "пидор", "хуй", "жопа", "нах", "еб", "чмо", "пиздец", "ебать", "сучка", "гондон"];
        function censor(text) {
            let result = text;
            badWords.forEach(w => {
                const reg = new RegExp(w, "gi");
                result = result.replace(reg, "***");
            });
            return result;
        }

        function loginWithGoogle() {
            const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=email%20profile`;
            window.location.href = authUrl;
        }

        window.onload = function() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');

            const saved = sessionStorage.getItem('bib_user');
            if (saved) {
                currentUser = JSON.parse(saved);
                initApp();
                return;
            }

            if (accessToken) {
                fetch(`https://www.googleapis.com/oauth2/v3/userinfo?access_token=${accessToken}`)
                    .then(r => r.json())
                    .then(data => {
                        const cleanId = data.sub || data.email.replace(/[^a-zA-Z0-9]/g, "_");
                        currentUser = { name: data.name, email: data.email, id: cleanId };
                        sessionStorage.setItem('bib_user', JSON.stringify(currentUser));
                        window.location.hash = '';
                        initApp();
                    });
            }
        };

        function initApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            
            document.getElementById('profile-name').innerText = currentUser.name;
            document.getElementById('profile-email').innerText = currentUser.email;

            checkAccountStatus();
            loadMessages();
            loadFavorites();
        }

        function switchTab(tab) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            if (tab === 'chat') {
                document.getElementById('screen-chat').classList.add('active');
                document.getElementById('btn-tab-chat').classList.add('active');
                document.getElementById('header-title').innerText = "BibChat";
            } else if (tab === 'favorites') {
                document.getElementById('screen-favorites').classList.add('active');
                document.getElementById('btn-tab-favorites').classList.add('active');
                document.getElementById('header-title').innerText = "Избранное";
            } else {
                document.getElementById('screen-profile').classList.add('active');
                document.getElementById('btn-tab-profile').classList.add('active');
                document.getElementById('header-title').innerText = "Профиль";
            }
        }

        function logout() {
            sessionStorage.removeItem('bib_user');
            window.location.href = REDIRECT_URI;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            let txt = input.value.trim();
            if (!txt || !currentUser) return;

            txt = censor(txt);
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            db.ref('messages').push({
                name: currentUser.name,
                text: txt,
                time: timeStr
            });
            input.value = '';
        }

        function deleteMessage(id) {
            db.ref('messages/' + id).remove();
        }

        function toggleFavorite(msg) {
            if (!currentUser) return;
            const favRef = db.ref(`favorites/${currentUser.id}/${msg.id}`);
            
            favRef.once('value', snap => {
                if (snap.exists()) {
                    favRef.remove();
                } else {
                    favRef.set({
                        name: msg.name,
                        text: msg.text,
                        time: msg.time
                    });
                }
            });
        }

        function loadMessages() {
            const box = document.getElementById('messages');
            db.ref('messages').on('value', snap => {
                box.innerHTML = '';
                const data = snap.val();
                if (data) {
                    Object.entries(data).forEach(([id, msg]) => {
                        const isMy = currentUser && msg.name === currentUser.name;
                        const div = document.createElement('div');
                        div.className = `message ${isMy ? 'my' : ''}`;
                        
                        let delBtn = isMy ? `<button class="action-btn delete-btn" onclick="deleteMessage('${id}')">Удалить</button>` : '';
                        const msgObj = JSON.stringify({ id, name: msg.name, text: msg.text, time: msg.time }).replace(/"/g, '&quot;');

                        div.innerHTML = `
                            <div class="msg-author">${msg.name}</div>
                            <div class="msg-text">${msg.text}</div>
                            <div class="msg-footer">
                                <span>${msg.time || ''}</span>
                                <div>
                                    <button class="action-btn fav-btn" onclick="toggleFavorite(${msgObj})">⭐ В избранное</button>
                                    ${delBtn}
                                </div>
                            </div>
                        `;
                        box.appendChild(div);
                    });
                    box.scrollTop = box.scrollHeight;
                }
            });
        }

        function loadFavorites() {
            if (!currentUser) return;
            const favBox = document.getElementById('favorite-messages');
            db.ref(`favorites/${currentUser.id}`).on('value', snap => {
                favBox.innerHTML = '';
                const data = snap.val();
                if (data) {
                    Object.entries(data).forEach(([id, msg]) => {
                        const div = document.createElement('div');
                        div.className = 'message';
                        const msgObj = JSON.stringify({ id, name: msg.name, text: msg.text, time: msg.time }).replace(/"/g, '&quot;');

                        div.innerHTML = `
                            <div class="msg-author">${msg.name}</div>
                            <div class="msg-text">${msg.text}</div>
                            <div class="msg-footer">
                                <span>${msg.time || ''}</span>
                                <button class="action-btn delete-btn" onclick="toggleFavorite(${msgObj})">Убрать</button>
                            </div>
                        `;
                        favBox.appendChild(div);
                    });
                } else {
                    favBox.innerHTML = '<div style="text-align:center; color:#94a3b8; margin-top:20px;">В избранном пусто</div>';
                }
            });
        }

        function checkAccountStatus() {
            if (!currentUser || !currentUser.id) return;
            
            db.ref('users/' + currentUser.id).on('value', snap => {
                const userData = snap.val();
                const statusBadge = document.getElementById('account-status');
                const btnDelete = document.getElementById('btn-delete-acc');
                const btnRestore = document.getElementById('btn-restore-acc');

                if (userData && userData.deleteAt) {
                    const daysLeft = Math.ceil((userData.deleteAt - Date.now()) / (1000 * 60 * 60 * 24));
                    if (daysLeft <= 0) {
                        alert("Срок хранения истёк. Аккаунт окончательно удален.");
                        logout();
                        return;
                    }
                    statusBadge.innerText = `Удаление через: ${daysLeft} дн.`;
                    statusBadge.className = "status-badge deletion";
                    btnDelete.style.display = "none";
                    btnRestore.style.display = "block";
                } else {
                    statusBadge.innerText = "Аккаунт активен";
                    statusBadge.className = "status-badge";
                    btnDelete.style.display = "block";
                    btnRestore.style.display = "none";
                }
            });
        }

        function requestDeleteAccount() {
            if (confirm("Удалить аккаунт через 14 дней?")) {
                const fourteenDaysMs = 14 * 24 * 60 * 60 * 1000;
                db.ref('users/' + currentUser.id).set({
                    deleteAt: Date.now() + fourteenDaysMs,
                    email: currentUser.email
                });
            }
        }

        function restoreAccount() {
            db.ref('users/' + currentUser.id).remove().then(() => {
                alert("Аккаунт восстановлен!");
            });
        }
    </script>
</body>
</html>
