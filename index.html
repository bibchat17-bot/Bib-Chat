<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bib-Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e63946, #f77f00);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            height: 90vh;
            overflow: hidden;
        }

        .chat-header {
            background: #111;
            color: #fff;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 1.2rem;
        }

        .tab-btn {
            background: #f77f00;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .messages-list {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f9f9f9;
        }

        .message-card {
            background: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: relative;
            word-wrap: break-word;
            border-left: 4px solid #f77f00;
        }

        .message-card.warning-card {
            border-left: 4px solid #d90429;
            background: #fff0f0;
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 4px;
        }

        .msg-text {
            font-size: 0.95rem;
            color: #222;
        }

        .bad-word-alert {
            color: #d90429;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .show-btn {
            background: #d90429;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-top: 5px;
        }

        .fav-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .chat-input-area {
            padding: 10px;
            background: #fff;
            display: flex;
            gap: 8px;
            border-top: 1px solid #eee;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .chat-input-area button {
            background: #e63946;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h2 id="chat-title">Bib-Chat</h2>
        <button class="tab-btn" onclick="toggleView()" id="toggle-btn">Избранное</button>
    </div>

    <div class="messages-list" id="messages-list"></div>

    <div class="chat-input-area" id="input-area">
        <input type="text" id="msg-input" placeholder="Введите сообщение...">
        <button onclick="sendMessage()">Отправить</button>
    </div>
</div>

<script>
    // Список нецензурных слов для фильтрации
    const BAD_WORDS = ["пизда", "блять", "хуй", "сука", "нахуй", "бля", "ебать", "пидор", "мудак", "пидец", "хер"];

    let messages = JSON.parse(localStorage.getItem('bib_chat_msgs')) || [];
    let favorites = JSON.parse(localStorage.getItem('bib_chat_favs')) || [];
    let currentTab = 'chat'; // 'chat' или 'fav'

    function saveStorage() {
        localStorage.setItem('bib_chat_msgs', JSON.stringify(messages));
        localStorage.setItem('bib_chat_favs', JSON.stringify(favorites));
    }

    // Проверка текста на наличие плохих слов
    function checkBadWords(text) {
        const lower = text.toLowerCase();
        return BAD_WORDS.some(word => lower.includes(word));
    }

    // Цензурирование текста
    function maskText(text) {
        let cleanText = text;
        BAD_WORDS.forEach(word => {
            const regex = new RegExp(word, 'gi');
            cleanText = cleanText.replace(regex, '***');
        });
        return cleanText;
    }

    function renderMessages() {
        const list = document.getElementById('messages-list');
        list.innerHTML = '';

        const source = currentTab === 'chat' ? messages : favorites;

        if (source.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:#888; margin-top:20px;">Сообщений пока нет</div>';
            return;
        }

        source.forEach((msg, idx) => {
            const card = document.createElement('div');
            card.className = 'message-card' + (msg.hasBadWords ? ' warning-card' : '');

            const isFav = favorites.some(f => f.id === msg.id);

            let contentHTML = '';

            if (msg.hasBadWords) {
                contentHTML = `
                    <div class="bad-word-alert">⚠️ Внимание: Контент содержит 18+! Просматривать с осторожностью.</div>
                    <div class="msg-text" id="text-${msg.id}">${msg.maskedText}</div>
                    <button class="show-btn" onclick="revealText('${msg.id}', '${encodeURIComponent(msg.originalText)}')">Показать оригинал</button>
                `;
            } else {
                contentHTML = `<div class="msg-text">${msg.originalText}</div>`;
            }

            card.innerHTML = `
                <div class="msg-header">
                    <span>${msg.time}</span>
                    <button class="fav-btn" onclick="toggleFav('${msg.id}')">${isFav ? '⭐' : '☆'}</button>
                </div>
                ${contentHTML}
            `;

            list.appendChild(card);
        });

        list.scrollTop = list.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;

        const hasBad = checkBadWords(text);
        const masked = maskText(text);

        const newMsg = {
            id: Date.now().toString(),
            originalText: text,
            maskedText: masked,
            hasBadWords: hasBad,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        messages.push(newMsg);
        saveStorage();
        renderMessages();
        input.value = '';
    }

    function revealText(id, encodedOriginal) {
        const elem = document.getElementById(`text-${id}`);
        if (elem) {
            elem.innerText = decodeURIComponent(encodedOriginal);
        }
    }

    function toggleFav(id) {
        const msg = messages.find(m => m.id === id) || favorites.find(m => m.id === id);
        if (!msg) return;

        const favIndex = favorites.findIndex(f => f.id === id);
        if (favIndex > -1) {
            favorites.splice(favIndex, 1);
        } else {
            favorites.push(msg);
        }

        saveStorage();
        renderMessages();
    }

    function toggleView() {
        const title = document.getElementById('chat-title');
        const btn = document.getElementById('toggle-btn');
        const inputArea = document.getElementById('input-area');

        if (currentTab === 'chat') {
            currentTab = 'fav';
            title.innerText = 'Избранное';
            btn.innerText = 'В чат';
            inputArea.style.display = 'none';
        } else {
            currentTab = 'chat';
            title.innerText = 'Bib-Chat';
            btn.innerText = 'Избранное';
            inputArea.style.display = 'flex';
        }

        renderMessages();
    }

    document.getElementById('msg-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
    });

    renderMessages();
</script>

</body>
</html>
