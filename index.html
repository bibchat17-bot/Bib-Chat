<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bib-Chat — Глобальный чат</title>
    <!-- Подключение Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Подключение Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e63946, #f77f00);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Экран входа */
        .login-card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .login-card h1 {
            color: #111;
            font-size: 1.8rem;
        }

        .login-card p {
            color: #666;
            font-size: 0.95rem;
        }

        /* Основной контейнер приложения */
        .chat-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: none;
            flex-direction: column;
            height: 90vh;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            background: #111;
            color: #fff;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 1.1rem;
        }

        .tab-btn {
            background: #f77f00;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .messages-list {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f9f9f9;
            margin-bottom: 55px;
        }

        .message-card {
            background: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: relative;
            word-wrap: break-word;
            border-left: 4px solid #f77f00;
        }

        .message-card.warning-card {
            border-left: 4px solid #d90429;
            background: #fff0f0;
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 4px;
        }

        .msg-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .msg-text {
            font-size: 0.95rem;
            color: #222;
        }

        .bad-word-alert {
            color: #d90429;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .show-btn {
            background: #d90429;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-top: 5px;
        }

        .action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .chat-input-area {
            position: absolute;
            bottom: 55px;
            left: 0;
            right: 0;
            padding: 10px;
            background: #fff;
            display: flex;
            gap: 8px;
            border-top: 1px solid #eee;
            z-index: 10;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .chat-input-area button {
            background: #e63946;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Экран Профиля */
        .profile-screen {
            display: none;
            flex-direction: column;
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            gap: 15px;
            background: #fff;
            margin-bottom: 55px;
        }

        .profile-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #eee;
        }

        .profile-card h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #333;
        }

        .info-badge {
            display: inline-block;
            background: #e3f2fd;
            color: #0d47a1;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-top: 5px;
            font-weight: bold;
        }

        .platform-tag {
            display: inline-block;
            background: #e8f5e9;
            color: #1b5e20;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-top: 5px;
            font-weight: bold;
        }

        .btn-danger {
            background: #d90429;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }

        .btn-warning {
            background: #f77f00;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }

        /* Нижняя навигационная панель */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 55px;
            background: #ffffff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            cursor: pointer;
            font-size: 0.85rem;
            color: #777;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-weight: bold;
        }

        .nav-item.active {
            color: #e63946;
        }

        .nav-icon {
            font-size: 1.2rem;
        }

        .deletion-banner {
            background: #ffe3e3;
            border: 1px solid #ffb4b4;
            color: #d90429;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<!-- Экран Авторизации -->
<div class="login-card" id="login-screen">
    <h1>Bib-Chat</h1>
    <p>Войдите через Google, чтобы войти в Глобальный чат.</p>
    
    <div id="g_id_onload"
         data-client_id="880927818848-kb4kte7oln0i7jork2h8i95sdknrmmt2.apps.googleusercontent.com"
         data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard" data-size="large"></div>
</div>

<!-- Основной Контейнер Приложения -->
<div class="chat-container" id="chat-screen">
    
    <!-- Шапка (для раздела «Чаты») -->
    <div class="chat-header" id="header-chats">
        <h2 id="chat-title">Глобальный чат</h2>
        <button class="tab-btn" onclick="toggleFavView()" id="toggle-btn">Избранное</button>
    </div>

    <!-- Шапка (для раздела «Профиль») -->
    <div class="chat-header" id="header-profile" style="display: none;">
        <h2>Мой Профиль</h2>
    </div>

    <!-- Раздел «Чаты» (Список сообщений) -->
    <div class="messages-list" id="messages-list"></div>

    <!-- Поле ввода сообщения -->
    <div class="chat-input-area" id="input-area">
        <input type="text" id="msg-input" placeholder="Напишите сообщение...">
        <button onclick="sendMessage()">Отправить</button>
    </div>

    <!-- Раздел «Профиль» -->
    <div class="profile-screen" id="profile-view">
        <div id="deletion-notice"></div>

        <div class="profile-card">
            <h3>Аккаунт</h3>
            <p><strong>Имя:</strong> <span id="prof-user-name">-</span></p>
            <p style="margin-top: 5px;"><strong>ID:</strong> <span id="prof-user-id" style="font-size: 0.75rem; color:#666;">-</span></p>
        </div>

        <div class="profile-card">
            <h3>Операционная система и платформа</h3>
            <p>Система:</p>
            <div class="info-badge" id="os-version-info">Определение...</div>
            <p style="margin-top: 10px;">Тип клиента:</p>
            <div class="platform-tag" id="platform-mode-info">Определение...</div>
        </div>

        <div class="profile-card">
            <h3>Управление аккаунтом</h3>
            <div id="account-actions">
                <button class="btn-secondary" onclick="logout()">Выйти из аккаунта</button>
                <button class="btn-danger" onclick="requestAccountDeletion()">Запросить удаление аккаунта (14 дней)</button>
            </div>
        </div>
    </div>

    <!-- Нижняя навигационная панель -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-chats" onclick="switchNavTab('chats')">
            <span class="nav-icon">💬</span>
            <span>Чаты</span>
        </div>
        <div class="nav-item" id="nav-profile" onclick="switchNavTab('profile')">
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </div>
    </div>

</div>
<script>
    // --- СПИСОК ПЛОХИХ СЛОВ И НЕНОРМАТИВНОЙ ЛЕКСИКИ ---
    const BAD_WORDS = [
        "пизда", "блять", "хуй", "сука", "нахуй", "бля", "пидец", "пипец", 
        "ебать", "еб", "ебан", "мудак", "долбаеб", "долбоеб", "залупа", 
        "гандон", "презерватив", "пидор", "пидорас", "уебок", "шлюха", "сучка"
    ];

    // Конфигурация Firebase Realtime Database
    const firebaseConfig = {
        databaseURL: "https://bib-chat-default-rtdb.firebaseio.com/"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Состояние приложения
    let currentUser = null;
    let messagesData = {};
    let favorites = new Set();
    let showOnlyFavs = false;
    let currentTab = 'chats';

    // Вспомогательные функции для поиска и маскирования слов
    function containsBadWords(text) {
        if (!text) return false;
        const lower = text.toLowerCase();
        return BAD_WORDS.some(word => lower.includes(word));
    }

    function maskBadWords(text) {
        if (!text) return "";
        let result = text;
        BAD_WORDS.forEach(word => {
            const regex = new RegExp(word, "gi");
            result = result.replace(regex, "*****");
        });
        return result;
    }

    // Обработка Google Sign-In
    function handleCredentialResponse(response) {
        const payload = parseJwt(response.credential);
        currentUser = {
            id: payload.sub,
            name: payload.name,
            email: payload.email,
            picture: payload.picture
        };

        // Сохраняем/обновляем пользователя в базе данных
        db.ref('users/' + currentUser.id).update({
            name: currentUser.name,
            email: currentUser.email,
            lastLogin: Date.now()
        });

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';

        initProfileInfo();
        checkDeletionStatus();
        loadFavorites();
        listenMessages();
    }

    function parseJwt(token) {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
            return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    }

    // Информация о системе и устройстве
    function initProfileInfo() {
        if (!currentUser) return;

        document.getElementById('prof-user-name').innerText = currentUser.name;
        document.getElementById('prof-user-id').innerText = currentUser.id;

        const ua = navigator.userAgent;
        let osInfo = "Неизвестная ОС";
        
        if (ua.includes("Android")) {
            const match = ua.match(/Android\s([0-9\.]+)/);
            osInfo = match ? `Android ${match[1]}` : "Android";
        } else if (ua.includes("Windows")) {
            osInfo = "Windows OS";
        } else if (ua.includes("iPhone") || ua.includes("iPad")) {
            osInfo = "iOS";
        } else if (ua.includes("Linux")) {
            osInfo = "Linux";
        }

        document.getElementById('os-version-info').innerText = osInfo;

        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        const platformType = isStandalone ? "Автономное приложение (PWA)" : "Браузерная версия";
        document.getElementById('platform-mode-info').innerText = platformType;
    }

    // Проверка статуса запроса на удаление аккаунта
    function checkDeletionStatus() {
        if (!currentUser) return;

        db.ref('deletion_requests/' + currentUser.id).once('value', snapshot => {
            const data = snapshot.val();
            const noticeDiv = document.getElementById('deletion-notice');
            const actionsDiv = document.getElementById('account-actions');

            if (data && data.status === 'pending') {
                const now = Date.now();
                const daysLeft = Math.ceil((data.deleteAt - now) / (1000 * 60 * 60 * 24));

                if (daysLeft <= 0) {
                    noticeDiv.innerHTML = `<div class="deletion-banner">Ваш аккаунт запланирован к немедленному удалению.</div>`;
                } else {
                    noticeDiv.innerHTML = `
                        <div class="deletion-banner">
                            Запрошено удаление аккаунта.<br>
                            Осталось дней: <strong>${daysLeft}</strong>.
                        </div>
                    `;
                }

                actionsDiv.innerHTML = `
                    <button class="btn-secondary" onclick="logout()">Выйти из аккаунта</button>
                    <button class="btn-warning" onclick="cancelAccountDeletion()">Отменить запрос на удаление</button>
                `;
            } else {
                noticeDiv.innerHTML = '';
                actionsDiv.innerHTML = `
                    <button class="btn-secondary" onclick="logout()">Выйти из аккаунта</button>
                    <button class="btn-danger" onclick="requestAccountDeletion()">Запросить удаление аккаунта (14 дней)</button>
                `;
            }
        });
    }

    // Запрос на удаление аккаунта (14 дней)
    function requestAccountDeletion() {
        if (!currentUser) return;
        if (confirm("Вы уверены, что хотите запросить удаление аккаунта? У вас будет 14 дней на отмену.")) {
            const deleteAt = Date.now() + (14 * 24 * 60 * 60 * 1000);
            db.ref('deletion_requests/' + currentUser.id).set({
                userId: currentUser.id,
                userName: currentUser.name,
                requestedAt: Date.now(),
                deleteAt: deleteAt,
                status: 'pending'
            }).then(() => {
                alert("Запрос создан. Аккаунт будет удален через 14 дней.");
                checkDeletionStatus();
            });
        }
    }

    // Отмена запроса на удаление
    function cancelAccountDeletion() {
        if (!currentUser) return;
        db.ref('deletion_requests/' + currentUser.id).remove().then(() => {
            alert("Запрос на удаление аккаунта отменен.");
            checkDeletionStatus();
        });
    }

    // Выход из аккаунта
    function logout() {
        currentUser = null;
        document.getElementById('chat-screen').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
    }

    // Избранные сообщения
    function loadFavorites() {
        if (!currentUser) return;
        db.ref('users/' + currentUser.id + '/favorites').on('value', snapshot => {
            const data = snapshot.val() || {};
            favorites = new Set(Object.keys(data));
            renderMessages();
        });
    }

    function toggleFavorite(msgId) {
        if (!currentUser) return;
        const favRef = db.ref('users/' + currentUser.id + '/favorites/' + msgId);
        if (favorites.has(msgId)) {
            favRef.remove();
        } else {
            favRef.set(true);
        }
    }

    function toggleFavView() {
        showOnlyFavs = !showOnlyFavs;
        document.getElementById('toggle-btn').innerText = showOnlyFavs ? "Все" : "Избранное";
        renderMessages();
    }

    // Слушатель сообщений чата
    function listenMessages() {
        db.ref('global_chat').limitToLast(100).on('value', snapshot => {
            messagesData = snapshot.val() || {};
            renderMessages();
        });
    }

    // Отрисовка списка сообщений с цензурой и предупреждениями
    function renderMessages() {
        const container = document.getElementById('messages-list');
        container.innerHTML = '';

        const keys = Object.keys(messagesData);
        if (keys.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#999; margin-top:20px;">Сообщений пока нет</p>';
            return;
        }

        keys.forEach(id => {
            if (showOnlyFavs && !favorites.has(id)) return;

            const msg = messagesData[id];
            const isFav = favorites.has(id);
            const hasBadWords = containsBadWords(msg.text);

            const card = document.createElement('div');
            card.className = 'message-card' + (hasBadWords ? ' warning-card' : '');

            const header = document.createElement('div');
            header.className = 'msg-header';

            const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            header.innerHTML = `<strong>${escapeHtml(msg.userName)}</strong> <span>${timeStr}</span>`;

            const actions = document.createElement('div');
            actions.className = 'msg-actions';

            const favBtn = document.createElement('button');
            favBtn.className = 'action-btn';
            favBtn.innerHTML = isFav ? '★' : '☆';
            favBtn.style.color = isFav ? '#f77f00' : '#ccc';
            favBtn.onclick = () => toggleFavorite(id);
            actions.appendChild(favBtn);

            header.appendChild(actions);
            card.appendChild(header);

            const textDiv = document.createElement('div');
            textDiv.className = 'msg-text';

            if (hasBadWords) {
                const alertText = document.createElement('div');
                alertText.className = 'bad-word-alert';
                alertText.innerText = '⚠️ Предупреждение: Контент содержит 18+ (ненормативную лексику). Просматривать с осторожностью.';
                card.appendChild(alertText);

                const maskedText = maskBadWords(msg.text);
                const originalText = msg.text;

                const contentSpan = document.createElement('span');
                contentSpan.innerText = maskedText;

                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'show-btn';
                toggleBtn.innerText = 'Показать оригинал';
                let isOriginalShown = false;

                toggleBtn.onclick = () => {
                    isOriginalShown = !isOriginalShown;
                    contentSpan.innerText = isOriginalShown ? originalText : maskedText;
                    toggleBtn.innerText = isOriginalShown ? 'Скрыть оригинал' : 'Показать оригинал';
                };

                textDiv.appendChild(contentSpan);
                textDiv.appendChild(document.createElement('br'));
                textDiv.appendChild(toggleBtn);
            } else {
                textDiv.innerText = msg.text;
            }

            card.appendChild(textDiv);
            container.appendChild(card);
        });

        container.scrollTop = container.scrollHeight;
    }

    // Отправка нового сообщения
    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();

        if (!text || !currentUser) return;

        const newMsgRef = db.ref('global_chat').push();
        newMsgRef.set({
            userId: currentUser.id,
            userName: currentUser.name,
            text: text,
            timestamp: Date.now()
        });

        input.value = '';
    }

    document.getElementById('msg-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    // Навигация между вкладками «Чаты» и «Профиль»
    function switchNavTab(tab) {
        currentTab = tab;

        document.getElementById('nav-chats').classList.remove('active');
        document.getElementById('nav-profile').classList.remove('active');

        if (tab === 'chats') {
            document.getElementById('nav-chats').classList.add('active');
            document.getElementById('header-chats').style.display = 'flex';
            document.getElementById('header-profile').style.display = 'none';
            document.getElementById('messages-list').style.display = 'flex';
            document.getElementById('input-area').style.display = 'flex';
            document.getElementById('profile-view').style.display = 'none';
        } else if (tab === 'profile') {
            document.getElementById('nav-profile').classList.add('active');
            document.getElementById('header-chats').style.display = 'none';
            document.getElementById('header-profile').style.display = 'flex';
            document.getElementById('messages-list').style.display = 'none';
            document.getElementById('input-area').style.display = 'none';
            document.getElementById('profile-view').style.display = 'flex';
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
