<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Биб-чат</title>

    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Экран "Нет соединения" */
        #no-connection-screen { display: none; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 20px; background: #0f172a; }
        #no-connection-screen h2 { color: #ef4444; margin-bottom: 10px; font-size: 22px; }
        #no-connection-screen p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .btn-retry { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* Экран входа */
        .login-container { display: none; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 16px; text-align: center; max-width: 380px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; margin-bottom: 20px; font-size: 28px; }
        .btn-google { background: #fff; color: #0f172a; border: none; padding: 14px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; }

        /* Главный экран */
        #app-screen { display: none; flex-direction: column; height: 100vh; width: 100%; position: relative; }

        /* Шапка */
        .top-bar { height: 50px; background: #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #334155; flex-shrink: 0; }
        .top-bar h2 { font-size: 18px; color: #38bdf8; }
        .top-bar-btn { background: #334155; color: #38bdf8; border: none; padding: 6px 12px; border-radius: 16px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; }

        /* Контент страниц с отступом под фиксированное меню */
        .content-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; background: #0f172a; position: relative; padding-bottom: 65px; }
        .page { display: none; flex-direction: column; height: 100%; width: 100%; overflow-y: auto; }
        .page.active { display: flex; }

        /* Чат */
        .messages-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg-bubble { display: flex; flex-direction: column; max-width: 80%; background: #1e293b; padding: 10px 14px; border-radius: 14px; align-self: flex-start; word-break: break-word; }
        .msg-bubble.my-msg { align-self: flex-end; background: #0284c7; }
        .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .msg-avatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
        .msg-author { font-size: 12px; font-weight: bold; color: #cbd5e1; }
        .msg-text { font-size: 15px; line-height: 1.4; margin-bottom: 4px; }
        .msg-footer { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #94a3b8; gap: 10px; }
        .msg-actions { display: flex; gap: 8px; margin-top: 4px; }
        .msg-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 12px; }

        /* Плашка отмены удаления на 2 минуты */
        .undo-banner { display: none; background: #334155; padding: 8px 12px; border-top: 1px solid #475569; justify-content: space-between; align-items: center; font-size: 12px; color: #f8fafc; }
        .undo-banner-btns { display: flex; gap: 8px; }
        .undo-btn { background: #38bdf8; color: #0f172a; border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; }
        .undo-btn-danger { background: #ef4444; color: #fff; }

        /* Поле ввода */
        .chat-input-container { padding: 10px 12px; background: #1e293b; display: flex; gap: 8px; border-top: 1px solid #334155; flex-shrink: 0; }
        .chat-input { flex: 1; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px 14px; border-radius: 20px; font-size: 15px; outline: none; }
        .send-btn { background: #38bdf8; border: none; color: #0f172a; padding: 0 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* Профиль */
        .profile-container { padding: 30px 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; text-align: center; width: 100%; margin: auto 0; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #38bdf8; object-fit: cover; }
        .profile-name { font-size: 22px; font-weight: bold; }
        .profile-email { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
        .btn-action { width: 100%; max-width: 280px; padding: 12px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-logout { background: #ef4444; color: #fff; }
        .btn-delete { background: transparent; border: 1px solid #ef4444; color: #ef4444; margin-top: 10px; }
        .delete-notice { font-size: 12px; color: #f87171; max-width: 280px; margin-top: -5px; }

        /* Фиксированная нижняя панель */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #1e293b; display: flex; border-top: 1px solid #334155; z-index: 99; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #94a3b8; cursor: pointer; font-size: 12px; }
        .nav-item.active { color: #38bdf8; font-weight: bold; }
        .nav-icon { font-size: 20px; }

        /* Модальные окна */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #1e293b; border-radius: 16px; width: 100%; max-width: 320px; padding: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #fff; }
        .modal-btns { display: flex; flex-direction: column; gap: 10px; }
        .modal-btn { padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-del-all { background: #ef4444; color: #fff; }
        .btn-del-self { background: #334155; color: #38bdf8; }
        .btn-cancel { background: transparent; color: #94a3b8; border: 1px solid #334155; }
    </style>
</head>
<body>

    <!-- Экран "Нет соединения" -->
    <div id="no-connection-screen">
        <h2>Нет соединения</h2>
        <p>Проверьте подключение к интернету или настройку сети.</p>
        <button class="btn-retry" onclick="checkConnection()">Обновить</button>
    </div>

    <!-- Экран входа -->
    <div id="login-screen" class="login-container">
        <div class="card">
            <h1>Биб-чат</h1>
            <button class="btn-google" onclick="loginWithGoogle()">
                Войти через Google
            </button>
        </div>
    </div>

    <!-- Основное приложение -->
    <div id="app-screen">
        <div class="top-bar">
            <h2 id="page-title">Чат</h2>
            <button id="favorites-top-btn" class="top-bar-btn" onclick="openFavoritesModal()">
                ⭐ Избранное
            </button>
        </div>

        <div class="content-area">
            <!-- 1. ЧАТ -->
            <div id="page-chat" class="page active">
                <div class="messages-list" id="chat-messages"></div>
                
                <!-- Плашка восстановления на 2 минуты -->
                <div id="undo-banner" class="undo-banner">
                    <span id="undo-timer-text">Удалено у себя (120с)</span>
                    <div class="undo-banner-btns">
                        <button class="undo-btn" onclick="restoreSelfDeletedMsg()">Восстановить</button>
                        <button id="undo-del-everyone-btn" class="undo-btn undo-btn-danger" onclick="confirmDeleteEveryoneFromUndo()">Удалить для всех</button>
                    </div>
                </div>

                <div class="chat-input-container">
                    <input type="text" id="msg-input" class="chat-input" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
                    <button class="send-btn" onclick="sendMessage()">Отправить</button>
                </div>
            </div>

            <!-- 2. ПРОФИЛЬ -->
            <div id="page-profile" class="page">
                <div class="profile-container">
                    <img id="profile-img" class="profile-avatar" src="" alt="Avatar">
                    <div id="profile-name" class="profile-name">Загрузка...</div>
                    <div id="profile-email" class="profile-email">...</div>

                    <button class="btn-action btn-logout" onclick="logout()">Выйти из аккаунта</button>
                    <button class="btn-action btn-delete" onclick="requestAccountDeletion()">Удалить аккаунт через 14 дней</button>
                    <div id="delete-status" class="delete-notice"></div>
                </div>
            </div>
        </div>

        <!-- Нижнее меню из 2 кнопок -->
        <div class="bottom-nav">
            <div id="nav-chat-btn" class="nav-item active" onclick="switchPage('chat', 'Чат', this)">
                <span class="nav-icon">💬</span>
                <span>Чат</span>
            </div>
            <div id="nav-profile-btn" class="nav-item" onclick="switchPage('profile', 'Профиль', this)">
                <span class="nav-icon">👤</span>
                <span>Профиль</span>
            </div>
        </div>
    </div>

    <!-- Модальное окно: Выбор удаления -->
    <div id="delete-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">Удаление сообщения</div>
            <div class="modal-btns">
                <button class="modal-btn btn-del-self" onclick="confirmDeleteSelf()">Удалить у себя</button>
                <button id="btn-del-everyone" class="modal-btn btn-del-all" onclick="confirmDeleteEveryone()">Удалить для всех</button>
                <button class="modal-btn btn-cancel" onclick="closeDeleteModal()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно: Избранное -->
    <div id="favorites-modal" class="modal-overlay">
        <div class="modal-card" style="max-width: 360px; height: 80vh; display: flex; flex-direction: column;">
            <div class="modal-title">⭐ Избранное</div>
            <div class="messages-list" id="favorite-messages" style="flex: 1; text-align: left;"></div>
            <button class="modal-btn btn-cancel" style="margin-top: 10px;" onclick="closeFavoritesModal()">Закрыть</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDaz-XIubX1sj1NdF-mfyukHCAJAzTgDLI",
            authDomain: "bib-chat-64027.firebaseapp.com",
            databaseURL: "https://bib-chat-64027-default-rtdb.firebaseio.com",
            projectId: "bib-chat-64027",
            storageBucket: "bib-chat-64027.firebasestorage.app",
            messagingSenderId: "381474259253",
            appId: "1:381474259253:web:b0874af197b70efdf0cc7c",
            measurementId: "G-4QKXGTJDZW"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const provider = new firebase.auth.GoogleAuthProvider();

        let currentUser = null;
        let selectedMsgIdForDelete = null;
        let selectedMsgSenderId = null;

        // Удаление у себя с таймером 2 минуты (120с)
        let hiddenMessageIds = new Set();
        let lastSelfDeletedMsgId = null;
        let lastSelfDeletedSenderId = null;
        let undoTimerInterval = null;
        let undoSecondsLeft = 0;

        const badWords = ["сука", "блять"];

        function censor(text) {
            let result = text;
            badWords.forEach(w => {
                const reg = new RegExp(w, "gi");
                result = result.replace(reg, "***");
            });
            return result;
        }

        function loginWithGoogle() {
            firebase.auth().signInWithPopup(provider).catch((error) => {
                console.warn("Popup blocked or failed, trying redirect...", error);
                firebase.auth().signInWithRedirect(provider);
            });
        }

        function logout() {
            firebase.auth().signOut().then(() => {
                location.reload();
            });
        }

        function switchPage(pageId, title, navEl) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('page-' + pageId).classList.add('active');
            navEl.classList.add('active');
            document.getElementById('page-title').innerText = title;

            const favBtn = document.getElementById('favorites-top-btn');
            if (pageId === 'chat') {
                favBtn.style.display = 'flex';
            } else {
                favBtn.style.display = 'none';
            }
        }

        function updateProfileUI() {
            if (!currentUser) return;
            document.getElementById('profile-img').src = currentUser.picture || 'https://via.placeholder.com/90';
            document.getElementById('profile-name').innerText = currentUser.name;
            document.getElementById('profile-email').innerText = currentUser.email;

            db.ref('deletion_requests/' + currentUser.id).once('value', (snap) => {
                if (snap.exists()) {
                    const req = snap.val();
                    const daysLeft = Math.ceil((req.scheduledAt - Date.now()) / (1000 * 60 * 60 * 24));
                    document.getElementById('delete-status').innerText = `Заявка принята. Аккаунт будет удалён через ${daysLeft > 0 ? daysLeft : 0} дн.`;
                }
            });
        }

        function requestAccountDeletion() {
            if (!currentUser) return;
            if (confirm("Вы уверены, что хотите запросить удаление аккаунта? Аккаунт будет удалён через 14 дней.")) {
                const fourteenDaysInMs = 14 * 24 * 60 * 60 * 1000;
                const scheduledDate = Date.now() + fourteenDaysInMs;
                db.ref('deletion_requests/' + currentUser.id).set({
                    userId: currentUser.id,
                    email: currentUser.email,
                    requestedAt: Date.now(),
                    scheduledAt: scheduledDate
                }).then(() => {
                    alert("Заявка создана. Аккаунт автоматически удалится через 14 дней.");
                    updateProfileUI();
                });
            }
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            const cleanText = censor(text);
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const newMsgRef = db.ref('messages').push();
            newMsgRef.set({
                id: newMsgRef.key,
                senderId: currentUser.id,
                senderName: currentUser.name,
                senderPhoto: currentUser.picture || '',
                text: cleanText,
                time: timeStr,
                timestamp: Date.now()
            });

            input.value = '';
        }

        function listenToMessages() {
            const chatContainer = document.getElementById('chat-messages');
            db.ref('messages').orderByChild('timestamp').on('value', (snapshot) => {
                chatContainer.innerHTML = '';
                snapshot.forEach((childSnap) => {
                    const msg = childSnap.val();
                    if (hiddenMessageIds.has(msg.id)) return;

                    const isMine = currentUser && msg.senderId === currentUser.id;

                    const msgDiv = document.createElement('div');
                    msgDiv.className = `msg-bubble ${isMine ? 'my-msg' : ''}`;
                    msgDiv.innerHTML = `
                        <div class="msg-header">
                            <img class="msg-avatar" src="${msg.senderPhoto || 'https://via.placeholder.com/22'}" alt="">
                            <span class="msg-author">${msg.senderName}</span>
                        </div>
                        <div class="msg-text">${msg.text}</div>
                        <div class="msg-footer">
                            <span>${msg.time || ''}</span>
                            <div class="msg-actions">
                                <button class="msg-btn" onclick="toggleFavorite('${msg.id}', '${escapeHtml(msg.text)}', '${msg.senderName}', '${msg.time}')">⭐</button>
                                <button class="msg-btn" onclick="openDeleteModal('${msg.id}', '${msg.senderId}')">🗑️</button>
                            </div>
                        </div>
                    `;
                    chatContainer.appendChild(msgDiv);
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        /* Окно удаления */
        function openDeleteModal(msgId, senderId) {
            selectedMsgIdForDelete = msgId;
            selectedMsgSenderId = senderId;
            
            const btnEveryone = document.getElementById('btn-del-everyone');
            if (currentUser && currentUser.id === senderId) {
                btnEveryone.style.display = 'block';
            } else {
                btnEveryone.style.display = 'none';
            }

            document.getElementById('delete-modal').classList.add('active');
        }

        function closeDeleteModal() {
            selectedMsgIdForDelete = null;
            selectedMsgSenderId = null;
            document.getElementById('delete-modal').classList.remove('active');
        }

        /* Логика удаления "У себя" с таймером 2 минуты */
        function confirmDeleteSelf() {
            if (selectedMsgIdForDelete) {
                lastSelfDeletedMsgId = selectedMsgIdForDelete;
                lastSelfDeletedSenderId = selectedMsgSenderId;
                hiddenMessageIds.add(lastSelfDeletedMsgId);
                closeDeleteModal();
                listenToMessages();

                startUndoTimer();
            }
        }

        function startUndoTimer() {
            clearInterval(undoTimerInterval);
            undoSecondsLeft = 120;
            const banner = document.getElementById('undo-banner');
            const timerText = document.getElementById('undo-timer-text');
            const btnEveryone = document.getElementById('undo-del-everyone-btn');

            if (currentUser && currentUser.id === lastSelfDeletedSenderId) {
                btnEveryone.style.display = 'inline-block';
            } else {
                btnEveryone.style.display = 'none';
            }

            banner.style.display = 'flex';
            timerText.innerText = `Сообщение скрыто (${undoSecondsLeft}с)`;

            undoTimerInterval = setInterval(() => {
                undoSecondsLeft--;
                if (undoSecondsLeft > 0) {
                    timerText.innerText = `Сообщение скрыто (${undoSecondsLeft}с)`;
                } else {
                    clearInterval(undoTimerInterval);
                    banner.style.display = 'none';
                    lastSelfDeletedMsgId = null;
                }
            }, 1000);
        }

        function restoreSelfDeletedMsg() {
            if (lastSelfDeletedMsgId) {
                hiddenMessageIds.delete(lastSelfDeletedMsgId);
                clearInterval(undoTimerInterval);
                document.getElementById('undo-banner').style.display = 'none';
                lastSelfDeletedMsgId = null;
                listenToMessages();
            }
        }

        function confirmDeleteEveryoneFromUndo() {
            if (lastSelfDeletedMsgId) {
                db.ref('messages/' + lastSelfDeletedMsgId).remove();
                clearInterval(undoTimerInterval);
                document.getElementById('undo-banner').style.display = 'none';
                lastSelfDeletedMsgId = null;
            }
        }

        function confirmDeleteEveryone() {
            if (selectedMsgIdForDelete) {
                db.ref('messages/' + selectedMsgIdForDelete).remove();
                closeDeleteModal();
            }
        }

        /* Избранное */
        function openFavoritesModal() {
            document.getElementById('favorites-modal').classList.add('active');
        }

        function closeFavoritesModal() {
            document.getElementById('favorites-modal').classList.remove('active');
        }

        function toggleFavorite(msgId, text, senderName, time) {
            if (!currentUser) return;
            db.ref(`favorites/${currentUser.id}/${msgId}`).set({
                id: msgId,
                text: text,
                senderName: senderName,
                time: time,
                savedAt: Date.now()
            }).then(() => alert("Сохранено в Избранное!"));
        }

        function listenToFavorites() {
            if (!currentUser) return;
            const favContainer = document.getElementById('favorite-messages');
            db.ref(`favorites/${currentUser.id}`).on('value', (snapshot) => {
                favContainer.innerHTML = '';
                if (!snapshot.exists()) {
                    favContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: #94a3b8;">Нет сохранённых сообщений</div>';
                    return;
                }
                snapshot.forEach((childSnap) => {
                    const msg = childSnap.val();
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'msg-bubble';
                    msgDiv.style.width = '100%';
                    msgDiv.style.background = '#0f172a';
                    msgDiv.style.marginBottom = '10px';
                    msgDiv.innerHTML = `
                        <div class="msg-header"><span class="msg-author">${msg.senderName}</span></div>
                        <div class="msg-text">${msg.text}</div>
                        <div class="msg-footer">
                            <span>${msg.time || ''}</span>
                            <button class="msg-btn" onclick="removeFavorite('${msg.id}')">❌ Удалить</button>
                        </div>
                    `;
                    favContainer.appendChild(msgDiv);
                });
            });
        }

        function removeFavorite(msgId) {
            if (currentUser) {
                db.ref(`favorites/${currentUser.id}/${msgId}`).remove();
            }
        }

        /* Мониторинг сети и управления экранами */
        function showNoConnectionScreen() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('no-connection-screen').style.display = 'flex';
        }

        function hideNoConnectionScreen() {
            document.getElementById('no-connection-screen').style.display = 'none';
            if (currentUser) {
                showAppScreen();
            } else {
                showLoginScreen();
            }
        }

        function checkConnection() {
            if (!navigator.onLine) {
                showNoConnectionScreen();
            } else {
                hideNoConnectionScreen();
            }
        }

        function showLoginScreen() {
            document.getElementById('no-connection-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        }

        function showAppScreen() {
            document.getElementById('no-connection-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';

            updateProfileUI();
            listenToMessages();
            listenToFavorites();
        }

        function escapeHtml(str) {
            return str ? str.replace(/'/g, "\\'").replace(/"/g, "&quot;") : '';
        }

        // Отслеживание онлайн/офлайн событий
        window.addEventListener('online', checkConnection);
        window.addEventListener('offline', showNoConnectionScreen);

        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === false && currentUser) {
                showNoConnectionScreen();
            }
        });

        /* Авторизация Firebase */
        firebase.auth().getRedirectResult().catch((error) => {
            console.error("Redirect Error:", error);
            showNoConnectionScreen();
        });

        firebase.auth().onAuthStateChanged((user) => {
            if (!navigator.onLine) {
                showNoConnectionScreen();
                return;
            }

            if (user) {
                currentUser = {
                    id: user.uid,
                    name: user.displayName || user.email.split("@")[0],
                    email: user.email,
                    picture: user.photoURL
                };
                showAppScreen();
            } else {
                showLoginScreen();
            }
        });
    </script>
</body>
</html>
