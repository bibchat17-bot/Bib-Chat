<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bib Chat</title>
    <!-- Подключаем Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .container { width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; text-align: center; }
        .card { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .btn-google { background: #fff; color: #333; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; width: 100%; justify-content: center; box-sizing: border-box; }
        .btn-google:hover { background: #f1f5f9; }
        
        #main-app { display: none; width: 100%; max-width: 400px; height: 100vh; flex-direction: column; background: #0f172a; position: relative; }
        
        /* Экраны */
        .screen { flex: 1; display: none; flex-direction: column; overflow: hidden; }
        .screen.active { display: flex; }

        .chat-header { background: #1e293b; padding: 15px; font-weight: bold; border-bottom: 1px solid #334155; text-align: center; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        /* Стили сообщения */
        .message { background: #334155; padding: 10px 14px; border-radius: 10px; max-width: 85%; word-break: break-word; text-align: left; display: flex; flex-direction: column; gap: 4px; position: relative; }
        .message.my { background: #0284c7; align-self: flex-end; }
        .msg-author { font-size: 12px; font-weight: bold; color: #38bdf8; }
        .message.my .msg-author { color: #bae6fd; }
        .msg-text { font-size: 14px; }
        .msg-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 4px; }
        .msg-time { font-size: 10px; color: #94a3b8; }
        .message.my .msg-time { color: #e0f2fe; }
        .delete-btn { background: none; border: none; color: #fca5a5; font-size: 11px; cursor: pointer; padding: 0; }

        .chat-input-area { padding: 15px; background: #1e293b; display: flex; gap: 10px; border-top: 1px solid #334155; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
        .chat-input-area button { background: #0284c7; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Профиль */
        .profile-content { padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 15px; text-align: center; }
        .profile-card { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; box-sizing: border-box; }

        /* Нижняя панель */
        .bottom-nav { height: 60px; background: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { background: none; border: none; color: #94a3b8; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: #38bdf8; }
        .logout-btn { background: #ef4444; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Экран входа -->
    <div id="login-screen" class="container">
        <div class="card">
            <h1>BibChat</h1>
            <p>Войдите через аккаунт Google, чтобы начать общение</p>
            <button class="btn-google" onclick="loginWithGoogle()">
                <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Войти через Google
            </button>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <div id="main-app">
        <!-- Экран 1: Чат -->
        <div id="screen-chat" class="screen active">
            <div class="chat-header">Общий чат</div>
            <div class="chat-messages" id="messages"></div>
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Отправить</button>
            </div>
        </div>

        <!-- Экран 2: Профиль -->
        <div id="screen-profile" class="screen">
            <div class="chat-header">Профиль</div>
            <div class="profile-content">
                <div class="profile-card">
                    <h3 id="profile-name" style="color: #38bdf8; margin-top: 0;">Имя</h3>
                    <p id="profile-email" style="margin-bottom: 0;">email@gmail.com</p>
                </div>
                <button class="logout-btn" onclick="logout()">Выйти из аккаунта</button>
            </div>
        </div>

        <!-- Нижняя навигационная панель -->
        <div class="bottom-nav">
            <button class="nav-item active" id="nav-chat" onclick="switchScreen('chat')">
                💬 Чат
            </button>
            <button class="nav-item" id="nav-profile" onclick="switchScreen('profile')">
                👤 Профиль
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://bib-chat-64027-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const CLIENT_ID = "880927818848-kb4kte7oln0i7jork2h8i95sdknrmmt2.apps.googleusercontent.com";
        const REDIRECT_URI = "https://bibchat17-bot.github.io/Bib-Chat/";

        let currentUser = null;

        // Фильтр цензуры
        const badWords = ["сука", "блять", "пидор", "хуй", "жопа", "нах", "еб", "чмо"];
        function filterText(text) {
            let filtered = text;
            badWords.forEach(word => {
                const regex = new RegExp(word, "gi");
                filtered = filtered.replace(regex, "***");
            });
            return filtered;
        }

        function loginWithGoogle() {
            const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=email%20profile`;
            window.location.href = authUrl;
        }

        window.onload = function() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');

            const savedUser = sessionStorage.getItem('bib_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showApp();
                return;
            }

            if (accessToken) {
                fetch(`https://www.googleapis.com/oauth2/v3/userinfo?access_token=${accessToken}`)
                    .then(res => res.json())
                    .then(data => {
                        currentUser = { name: data.name, email: data.email, id: data.sub };
                        sessionStorage.setItem('bib_user', JSON.stringify(currentUser));
                        window.location.hash = '';
                        showApp();
                    })
                    .catch(err => console.error("Ошибка получения профиля:", err));
            }
        };

        function showApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            
            document.getElementById('profile-name').innerText = currentUser.name;
            document.getElementById('profile-email').innerText = currentUser.email;

            loadMessages();
        }

        function switchScreen(screenName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            if (screenName === 'chat') {
                document.getElementById('screen-chat').classList.add('active');
                document.getElementById('nav-chat').classList.add('active');
            } else if (screenName === 'profile') {
                document.getElementById('screen-profile').classList.add('active');
                document.getElementById('nav-profile').classList.add('active');
            }
        }

        function logout() {
            sessionStorage.removeItem('bib_user');
            window.location.href = REDIRECT_URI;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            let text = input.value.trim();
            if (!text || !currentUser) return;

            // Применяем цензуру
            text = filterText(text);

            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            db.ref('messages').push({
                name: currentUser.name,
                email: currentUser.email,
                text: text,
                time: timeString
            });
            input.value = '';
        }

        function deleteMessage(messageId) {
            db.ref('messages/' + messageId).remove();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function loadMessages() {
            const messagesContainer = document.getElementById('messages');
            db.ref('messages').on('value', (snapshot) => {
                messagesContainer.innerHTML = '';
                const data = snapshot.val();
                if (data) {
                    Object.entries(data).forEach(([id, msg]) => {
                        const div = document.createElement('div');
                        const isMyMessage = currentUser && msg.name === currentUser.name;
                        div.className = `message ${isMyMessage ? 'my' : ''}`;

                        let deleteButtonHtml = '';
                        if (isMyMessage) {
                            deleteButtonHtml = `<button class="delete-btn" onclick="deleteMessage('${id}')">Удалить</button>`;
                        }

                        div.innerHTML = `
                            <div class="msg-author">${msg.name}</div>
                            <div class="msg-text">${msg.text}</div>
                            <div class="msg-footer">
                                <span class="msg-time">${msg.time || ''}</span>
                                ${deleteButtonHtml}
                            </div>
                        `;
                        messagesContainer.appendChild(div);
                    });
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            });
        }
    </script>
</body>
</html>
